[workspace]
members = [
    "crates/sbc-core",
    "crates/sbc-bin",
    "crates/sbc-management",
    "crates/sbc-storage",
]
exclude = ["rsip-nixi"]
resolver = "2"

[workspace.package]
version = "0.20.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/NIXFEO/NIXI.TEL"
publish = false # deployed as a binary, never published to crates.io

[workspace.dependencies]
# rsip pour SIP
rsip = { version = "0.4", path = "rsip-nixi" }

# Async runtime
tokio = { version = "1.36", features = ["full"] }
tokio-util = "0.7"

# Networking
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "limit"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-rustls = "0.25"
rustls-native-certs = "0.7"
rustls-pemfile = "2.0"
tokio-tungstenite = "0.21"

# WebRTC
webrtc-ice = "0.9"
webrtc-dtls = "0.8"
webrtc-util = { version = "0.8", features = ["conn"] }
webrtc-srtp = "0.12"

# Media
opus = "0.3"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "macros", "uuid", "chrono", "json"] }

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dashmap = "5.5"
crossbeam = "0.8"
rayon = "1.8"
bytes = "1.5"
thiserror = "2.0"
anyhow = "1.0"
base64 = "0.22"
rand = "0.8"

# Crypto for SRTP and DTLS
aes = "0.8"
ctr = "0.9"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
x509-parser = "0.16"
subtle = "2.5"
rcgen = "0.12"

# Monitoring
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"

# Configuration
ipnetwork = "0.20"

# Async traits
async-trait = "0.1"

# OS interface
libc = "0.2"

[profile.release]
# Symbols are useless on the box (no debugger there) and cost ~30% of the
# binary; keep the default codegen so a full build still fits a 2 GB VPS.
strip = "symbols"
