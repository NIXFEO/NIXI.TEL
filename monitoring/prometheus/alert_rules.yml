# Example alerting rules for the NIXI SBC.
groups:
  - name: nixi-sbc
    rules:
      - alert: SBCDown
        expr: up{job="nixi-sbc"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "SBC is down (Prometheus cannot scrape /metrics)"

      - alert: SBCCdrsStale
        # No CDR written in the last hour while calls are being attempted.
        expr: (time() - sbc_last_cdr_written_timestamp_seconds > 3600)
              and (rate(sbc_calls_total[15m]) > 0)
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "No CDR written in over an hour despite call attempts"

      - alert: SBCRtpTimeouts
        # Sustained RTP inactivity teardowns → one-way-audio / media path issues.
        expr: rate(sbc_rtp_timeouts_total[10m]) > 0.05
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Elevated RTP inactivity timeouts (possible media path issue)"

      - alert: SBCSessionTimer422Retries
        # A trunk keeps answering 422 Session Interval Too Small: its Min-SE
        # floor is above [security] session_expires. The SBC retries (RFC
        # 4028 §7.4) so calls succeed, but every call pays a round trip —
        # raise session_expires to the trunk's floor (e.g. 14400 for Genesys).
        expr: rate(sbc_session_timer_422_retries_total[10m]) > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Trunk demands a Session-Expires above the configured value (422 retries ongoing)"

      - alert: SBCSipSendFailures
        # The SBC could not deliver SIP messages (dead TCP/TLS peer, closed
        # WS channel, unregistered TLS destination): calls end in ghost
        # sessions. Look at the "SIP send failed" warnings for the peer.
        expr: rate(sbc_sip_send_failures_total[10m]) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "SIP messages are failing to send ({{ $labels.transport }})"

      - alert: SBCTrunkDown
        # The trunk used to answer OPTIONS and stopped (sbc_trunk_up is only
        # exported for trunks that answered at least once). The router
        # already skips it after 3 consecutive failures; calls fail over.
        expr: sbc_trunk_up == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Trunk {{ $labels.trunk }} stopped answering OPTIONS"

      - alert: SBCTrunkRegistrationFailing
        # Outbound REGISTER toward the trunk keeps failing: inbound calls
        # from that trunk stop as soon as the last registration expires.
        expr: sbc_trunk_registered == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Outbound REGISTER to trunk {{ $labels.trunk }} is failing"

      - alert: SBCTrunkAsrLow
        # Answer-seizure ratio below 30% over 30 minutes with at least 10
        # attempts: the trunk rejects or does not answer most calls
        # (routing/number-format problem on our side, or the carrier's).
        expr: |
          (sum by (trunk)(increase(sbc_trunk_calls_total{direction="outbound",outcome="answered"}[30m]))
            / sum by (trunk)(increase(sbc_trunk_calls_total{direction="outbound"}[30m]))) < 0.3
          and sum by (trunk)(increase(sbc_trunk_calls_total{direction="outbound"}[30m])) >= 10
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "ASR on trunk {{ $labels.trunk }} below 30% over 30 minutes"

      - alert: SBCTrunkUnavailable
        # An enabled trunk the router will not select: 3+ strikes in a row
        # (cooldown) or a 503 Retry-After park. Informational when failover
        # carries the traffic; with a single trunk every call is refused.
        expr: sbc_trunk_available == 0 and on(trunk) sbc_trunk_enabled == 1
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "Trunk {{ $labels.trunk }} is not selectable (cooldown or 503 Retry-After park)"

      - alert: SBCStoreUnavailable
        # The SQLite config store is not open/hydrated: the SBC runs from the
        # TOML seeds only ([database] allow_missing_store = true), every
        # API write answers 503 and /ready stays 503.
        expr: sbc_store_available == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "SBC config store unavailable (running from TOML seeds only)"

      - alert: SBCMediaOneWay
        # One direction of a call stayed silent for 10 s while the other
        # was delivering. A NAT or firewall asymmetry looks like this —
        # but so does a call on hold and a leg with aggressive silence
        # suppression, so this is informational: read it against the call
        # rate, and never as proof of a fault.
        expr: increase(sbc_media_one_way_calls_total[30m]) > 3
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "One-way audio reported on {{ $value }} call(s) in 30m ({{ $labels.leg }} silent) — holds and silence-suppressed legs count too"

      - alert: SBCMediaRelayFailures
        # Calls the SBC could not anchor media for: refused with 503 before
        # dialling, or ended just after the answer (CDR media-unavailable).
        expr: increase(sbc_media_relay_failures_total[15m]) > 0
        labels: { severity: critical }
        annotations:
          summary: "{{ $value }} call(s) had no media anchor (ports exhausted? relay bind failed?)"

      - alert: SBCRtpPortsForcedReuse
        # The RTP range is too small for the call rate: pairs are being
        # reused before their stray-packet quarantine elapsed.
        expr: increase(sbc_rtp_port_quarantine_forced_total[1h]) > 0
        labels: { severity: warning }
        annotations:
          summary: "RTP port range too small: {{ $value }} pair(s) reused before quarantine"

      - alert: SBCStoreCreatedEmpty
        # The store file was missing at boot and a new, empty one was
        # created: no users, no trunks, no DIDs — every call is refused.
        # Either a first boot before any API write, or a lost store (an
        # unmounted volume, a mistyped restore).
        expr: sbc_store_created_empty == 1
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "SBC started with a brand-new empty config store — restore it"

      - alert: SBCStoreBackupStale
        # No successful backup for twice the configured interval while the
        # timer is enabled (the interval gauge follows backup_interval_hours).
        expr: sbc_store_backups_enabled == 1
              and (time() - sbc_store_backup_last_success_timestamp_seconds) > 2 * sbc_store_backup_interval_seconds
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "SBC store backup is stale (last success older than twice the interval)"

      - alert: SBCStoreBackupFailed
        expr: increase(sbc_store_backup_failures_total[1d]) > 0
        labels: { severity: warning }
        annotations:
          summary: "An SBC store backup failed in the last 24 h (disk full? permissions?)"

      - alert: SBCCertExpiringSoon
        # A TLS/WSS listener certificate expires within 14 days: the certbot
        # deploy hook (POST /api/v1/tls/reload) did not run or failed.
        expr: sbc_tls_cert_expiry_timestamp_seconds > 0
              and (sbc_tls_cert_expiry_timestamp_seconds - time()) < 14 * 86400
              and sbc_tls_cert_expiry_timestamp_seconds > time()
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "Certificate of the {{ $labels.listener }} listener ({{ $labels.bind }}) expires within 14 days"

      - alert: SBCCertExpired
        expr: sbc_tls_cert_expiry_timestamp_seconds > 0
              and sbc_tls_cert_expiry_timestamp_seconds < time()
        labels: { severity: critical }
        annotations:
          summary: "Certificate of the {{ $labels.listener }} listener ({{ $labels.bind }}) has expired"

      - alert: SBCConfigReloadFailed
        # SIGHUP / POST /api/v1/reload could not read, parse or hydrate: the
        # runtime kept its previous values (GET /api/v1/config.last_reload).
        expr: increase(sbc_config_reloads_total{result="error"}[15m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "An SBC configuration reload failed (see /api/v1/config.last_reload)"

      - alert: SBCCdrWriteErrors
        # The CDR writer could not commit (stage="sqlite": store error, retried
        # with backoff), the queue was full (stage="queue": records live in the
        # memory cache only), the JSONL mirror failed, or duplicates were found.
        expr: increase(sbc_cdr_write_errors_total[15m]) > 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "CDRs are failing to persist (stage {{ $labels.stage }})"

      - alert: SBCCdrQueueBacklog
        # Records queued for the store writer keep piling up: the store is
        # slow or stuck (a writer in retry backoff also fires SBCCdrsStale).
        expr: sbc_cdr_queue_length > 1000
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "CDR writer backlog above 1000 records"

      - alert: SBCLogLinesDropped
        # The non-blocking log writer discarded lines (journald/stdout
        # back-pressure): call forensics for that window are incomplete.
        expr: increase(sbc_log_dropped_lines_total[10m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "The SBC is dropping log lines (journald back-pressure)"

      - alert: SBCAuthFailureSpike
        expr: rate(sbc_auth_failures_total[5m]) > 5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Sustained SIP auth-failure rate (scanner activity / brute force)"
